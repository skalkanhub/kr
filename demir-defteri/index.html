<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Demir Defteri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Demir Defteri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app — sticky top bar, fixed 5-tab bar, one view at a time.
   Look: dark-first "salon zemini" (rubber-black, chalk white) with plate-gold accent; light theme is warm paper + ink. */
:root{
  color-scheme:dark;
  --bg:#131416; --bg-2:#1c1e22; --bg-3:#26292f; --line:#32363d; --line-2:#444952;
  --fg:#ecede9; --fg-2:#a8acb2; --fg-3:#787d85;
  --accent:#f2c230; --accent-ink:#1a1400; --accent-text:#f2c230; --accent-soft:rgba(242,194,48,.14);
  --good:#4cc38a; --warn:#f08a3e; --bad:#e5484d; --info:#5ba7ff;
  --good-soft:rgba(76,195,138,.16); --bad-soft:rgba(229,72,77,.16); --info-soft:rgba(91,167,255,.16);
  --p:#5ba7ff; --c:#f2c230; --f:#f08a3e;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f3f2ee; --bg-2:#ffffff; --bg-3:#ebe9e2; --line:#dad7ce; --line-2:#c3bfb3;
    --fg:#1b1b1a; --fg-2:#54575c; --fg-3:#83878e;
    --accent:#e6b41f; --accent-ink:#1a1400; --accent-text:#8a6900; --accent-soft:rgba(230,180,31,.18);
    --good:#1f8a4d; --warn:#c2611a; --bad:#c62d33; --info:#1f6fd6;
    --good-soft:rgba(31,138,77,.14); --bad-soft:rgba(198,45,51,.12); --info-soft:rgba(31,111,214,.12);
    --p:#1f6fd6; --c:#b58900; --f:#c2611a;
    --shadow:0 12px 32px rgba(40,35,20,.14);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f2ee; --bg-2:#ffffff; --bg-3:#ebe9e2; --line:#dad7ce; --line-2:#c3bfb3;
  --fg:#1b1b1a; --fg-2:#54575c; --fg-3:#83878e;
  --accent:#e6b41f; --accent-ink:#1a1400; --accent-text:#8a6900; --accent-soft:rgba(230,180,31,.18);
  --good:#1f8a4d; --warn:#c2611a; --bad:#c62d33; --info:#1f6fd6;
  --good-soft:rgba(31,138,77,.14); --bad-soft:rgba(198,45,51,.12); --info-soft:rgba(31,111,214,.12);
  --p:#1f6fd6; --c:#b58900; --f:#c2611a;
  --shadow:0 12px 32px rgba(40,35,20,.14);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;line-height:1.1;text-wrap:balance}
h1{font-size:30px;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:18px}
p{margin:0}
ul{margin:0;padding-left:18px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.brand svg{width:26px;height:26px;flex:none}
.topbar-right{display:flex;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-3);color:var(--fg);flex:none}
.iconbtn svg{width:20px;height:20px}

.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card-accent{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.card-accent .btn{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-sm{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.small{font-size:13px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-2)}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;line-height:1}
.big{font-size:40px}
.huge{font-size:76px;letter-spacing:-.01em}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .info{color:var(--info)} .acc{color:var(--accent-text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:var(--r-sm);font-weight:600;background:var(--bg-3);color:var(--fg);border:1px solid var(--line);transition:transform .08s ease;white-space:nowrap;min-height:42px}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-good{background:var(--good);color:#06130c;border-color:transparent}
.btn-danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn-ghost{background:transparent;border-color:var(--line-2)}
.btn-block{width:100%}
.btn-big{font-family:var(--font-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;padding:14px 18px;border-radius:var(--r);min-height:56px}
.btn:disabled{opacity:.5;cursor:default}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px;min-height:34px}
.btn-wrap{white-space:normal}

.input{width:100%;background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--fg);min-height:42px}
textarea.input{min-height:80px;resize:vertical;line-height:1.4}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.seg{display:flex;background:var(--bg-3);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:7px;font-weight:600;color:var(--fg-2);text-align:center;min-width:0}
.seg button.on{background:var(--bg-2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg.seg-5 button{font-size:13px;padding:8px 2px;letter-spacing:-.01em}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--bg-3);font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;line-height:1.5}
.chip.p{background:var(--accent-soft);color:var(--accent-text)}
.chip.s{border:1px solid var(--line-2);background:transparent}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg-2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--fg-3);text-transform:uppercase}
.tab svg{width:22px;height:22px}
.tab-ic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:28px;border-radius:999px}
.tab.on{color:var(--accent-text)}
.tab.on .tab-ic{background:var(--accent-soft)}

.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--bg-3);stroke-width:11}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .bar.over{stroke:var(--bad)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

.bar{height:8px;background:var(--bg-3);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar i.p{background:var(--p)} .bar i.c{background:var(--c)} .bar i.f{background:var(--f)}
.macro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.macro .label{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-transform:none;letter-spacing:0;font-size:12px;line-height:1.3;min-width:0}
.macro .label .val{color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:var(--r-sm);background:var(--bg-3);font-size:11px;font-weight:600;color:var(--fg-2);text-align:center;letter-spacing:.03em;text-transform:uppercase}
.day.today{outline:2px solid var(--accent);outline-offset:-2px;color:var(--fg)}
.day .k{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--fg);letter-spacing:0}
.day .k.off{color:var(--fg-3);font-weight:600}
.day .dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.dot.plan{background:var(--accent)} .dot.done{background:var(--good)} .dot.food{background:var(--info)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .t{font-weight:600}
.item .d{font-size:13px;color:var(--fg-2)}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.blockh{display:flex;align-items:baseline;gap:8px;padding-top:12px;margin-top:4px;border-top:1px dashed var(--line-2)}
.blockh:first-child{border-top:0;padding-top:0;margin-top:0}
.blockh .label{color:var(--accent-text)}
.ex{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%}
.ex.first,.blockh+.ex{border-top:0}
.ex .n{font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.15}
.ex .m{font-size:13px;color:var(--fg-2)}
.ex .sr{font-family:var(--font-display);font-size:19px;font-weight:700;white-space:nowrap;color:var(--accent-text);text-align:right;flex:none}
.ex .sr small{font-family:var(--font-body);font-size:12px;color:var(--fg-3);display:block;font-weight:500}
.ex .ord{width:26px;height:26px;border-radius:50%;background:var(--bg-3);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;flex:none;color:var(--fg-2)}
.ex .ord.done{background:var(--good-soft);color:var(--good)}
.ex .ord.cur{background:var(--accent);color:var(--accent-ink)}

.mm{width:100%;max-width:340px;height:auto;aspect-ratio:460/450;flex:none;margin:0 auto;display:block}
.mm .base{fill:var(--bg-3);stroke:var(--line-2);stroke-width:1.2}
.mm .limb{fill:none;stroke:var(--bg-3);stroke-width:21;stroke-linecap:round;stroke-linejoin:round}
.mm .limb-o{fill:none;stroke:var(--line-2);stroke-width:23.4;stroke-linecap:round;stroke-linejoin:round}
.mm .limb.leg{stroke-width:27} .mm .limb-o.leg{stroke-width:29.4}
.mm .m{fill:var(--fg-3);opacity:.28}
.mm .m path,.mm .m ellipse{stroke:var(--bg-2);stroke-width:1}
.mm .m .ml{fill:none;stroke:var(--bg-2);stroke-width:1.3;opacity:.95}
.mm .m.p{fill:var(--accent);opacity:1}
.mm .m.p path,.mm .m.p ellipse{stroke:rgba(0,0,0,.35)}
.mm .m.s{fill:var(--accent);opacity:.5}
.mm .sil{fill:var(--bg-3);stroke:var(--line-2);stroke-width:1.4;stroke-linejoin:round}
.mm .lbl{font-family:var(--font-body);font-size:10px;fill:var(--accent-text);font-weight:600}
.mm .lbl-line{stroke:var(--accent-text);stroke-width:1;opacity:.8}
.mm text{font-family:var(--font-body);font-size:12px;fill:var(--fg-3);text-transform:uppercase;letter-spacing:.1em}

.anim{width:100%;max-width:230px;aspect-ratio:1;margin:0 auto;background:var(--bg-3);border-radius:var(--r);overflow:hidden}
.anim svg{width:100%;height:100%;display:block}
.anim.anim-sm{width:112px;max-width:112px;margin:0;flex:none;border-radius:var(--r-sm)}
.anim line,.anim path,.anim circle,.anim rect{stroke-linecap:round;stroke-linejoin:round}
.anim .a-near{stroke:var(--fg);stroke-width:8;fill:none}
.anim .a-foot{stroke:var(--fg);stroke-width:6;fill:none}
.anim .a-far{stroke:var(--fg-3);stroke-width:8;fill:none;opacity:.45}
.anim .a-far-foot{stroke:var(--fg-3);stroke-width:6;fill:none;opacity:.45}
.anim .a-body{fill:var(--fg);stroke:var(--fg);stroke-width:5;stroke-linejoin:round}
.anim .a-neck{stroke:var(--fg);stroke-width:7;fill:none}
.anim .a-head{fill:var(--fg);stroke:none}
.anim .a-hand{fill:var(--fg);stroke:none}
.anim .a-hi{stroke:var(--accent);stroke-width:18;fill:none;opacity:.55}
.anim .a-hi-fill{fill:var(--accent);stroke:var(--accent);stroke-width:14;stroke-linejoin:round;opacity:.5}
.anim .a-hi-dot{fill:var(--accent);stroke:none;opacity:.6}
.anim .a-torso{stroke:var(--fg);stroke-width:9;fill:none}
.anim .a-torso-f{fill:var(--fg);stroke:var(--fg);stroke-width:6}
.anim .a-prop{fill:var(--accent);stroke:var(--accent);stroke-width:1}
.anim .a-prop-o{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.anim .a-env{stroke:var(--line-2);fill:var(--bg-2);stroke-width:2}
.anim .a-cable{stroke:var(--fg-3);stroke-dasharray:4 4;fill:none}
.anim-cap{font-size:12px;color:var(--fg-2);text-align:center}

.video{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:var(--r-sm);overflow:hidden;background:#000}
.video iframe,.video img,.video video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#000}
video.anim{object-fit:cover;background:#000}
.video-play{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.play-badge{width:66px;height:46px;border-radius:13px;background:#e62117;color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.45);position:relative}
.play-badge svg{width:28px;height:28px;fill:#fff;stroke:#fff}
.mini{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--bg-2);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.mini-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 16px}
.mini .iconbtn{width:34px;height:34px}
.fav{width:30px;height:30px;border-radius:7px;object-fit:cover;flex:none;background:var(--bg-3);color:var(--fg-3);display:inline-flex}
.fav svg{width:16px;height:16px;margin:auto}
.star{color:var(--fg-3)}.star.on{color:var(--accent)}.star.on svg{fill:currentColor}
.chip.on{background:var(--accent);color:#1a1400}
.chip.own{border:1px solid var(--accent)}
h4{font-family:var(--font-display);font-weight:700;letter-spacing:.01em}
body.has-mini .app{padding-bottom:calc(156px + env(safe-area-inset-bottom,0px))}
body.has-mini .toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{background:var(--bg-2);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);overscroll-behavior:contain}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 2px;flex:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

.rest-box{background:var(--bg);border:2px solid var(--accent);border-radius:var(--r);padding:12px 12px 14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.rest-box .huge{color:var(--accent-text)}
.rest-box .bar{width:100%}
.rest-box .bar i{transition:width .5s linear}

.set-row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row .i{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--fg-3)}
.set-row.done .i{color:var(--good)}
.set-row .v{font-family:var(--font-display);font-size:19px;font-weight:700}
.set-row .v small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--fg-3);margin-left:6px}
.stepper{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.stepper button{height:50px;font-size:24px;color:var(--fg-2);text-align:center;font-weight:500}
.stepper input{width:100%;height:50px;text-align:center;background:transparent;border:0;font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--fg);min-width:0;-moz-appearance:textfield;padding:0}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:pop .2s ease;text-align:center}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:8px}

const r1 = n => Math.round(n * 10) / 10;

function fmtClock(sec){ sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }
function fmtDur(ms){ const sec = Math.floor(ms / 1000); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }

/* --- Kalori / makro --- */
const ACTIVITY = { 1:1.2, 2:1.375, 3:1.55, 4:1.725 };
const ACTIVITY_LABEL = { 1:'Hareketsiz (masa başı)', 2:'Hafif aktif (haftada 1-3 antrenman)', 3:'Orta aktif (haftada 3-5 antrenman)', 4:'Çok aktif (ağır iş + antrenman)' };
const GOAL_LABEL = { cut:'Yağ yak (−500 kcal)', maintain:'Koru', bulk:'Kas yap (+300 kcal)' };
function bmr(p){ return 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'k' ? -161 : 5); }
function tdee(p){ return bmr(p) * (ACTIVITY[p.activity] || 1.375); }
function targets(p){
  const b = bmr(p), t = tdee(p);
  let kcal = Math.round(p.goal === 'cut' ? t - 500 : p.goal === 'bulk' ? t + 300 : t);
  if (p.kcalOverride) kcal = p.kcalOverride;
  const prot = Math.round(p.weight * (p.goal === 'cut' ? 2.2 : 1.8));
  const fat = Math.round(kcal * 0.25 / 9);
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  return { bmr: Math.round(b), tdee: Math.round(t), kcal, prot, fat, carb };
}
function sumFoods(list){ return (list || []).reduce((a, f) => ({ kcal:a.kcal + (+f.kcal || 0), p:a.p + (+f.p || 0), c:a.c + (+f.c || 0), f:a.f + (+f.f || 0) }), { kcal:0, p:0, c:0, f:0 }); }
function scaleFood(food, grams){ const k = grams / 100; return { name:food.name, grams, kcal:Math.round(food.kcal * k), p:r1(food.p * k), c:r1(food.c * k), f:r1(food.f * k) }; }

/* --- Kuvvet --- */
function e1rm(kg, reps){ if (!kg || !reps) return 0; return reps === 1 ? kg : kg * (1 + reps / 30); }
function setVolume(sets){ return (sets || []).reduce((a, s) => a + (+s.kg || 0) * (+s.reps || 0), 0); }
function bestSet(sets){ return (sets || []).reduce((b, s) => (!b || e1rm(s.kg, s.reps) > e1rm(b.kg, b.reps)) ? s : b, null); }
function increment(ex){ return ex.lower ? 5 : 2.5; }

/* --- Program --- */
function restFor(style, ex, block){
  const r = ERAS[style].rest;

  return ex.compound ? r.compound : r.accessory;
}
function resolveEquip(id, equip){
  const ex = EX[id]; if (!ex) return id;
  if (equip === 'home') return (ex.home && EX[ex.home]) ? ex.home : id;
  if (equip === 'machine') return (ex.machine && EX[ex.machine]) ? ex.machine : id;
  return id;
}
const EQUIP_MODES = { gym:'Serbest ağırlık', machine:'Makine ağırlıklı', home:'Ev' };
function buildWorkout(style, split, days, idx, equip){
  const d = (((TEMPLATES[style] || {})[split] || {})[days] || [])[idx]; if (!d) return null;
  return { key: d.key, name: d.name, exercises: d.ex.map(e => { const id = resolveEquip(e[0], equip); return { exId:id, sets:e[1], repMin:e[2], repMax:e[3], block:e[4], rest: restFor(style, EX[id], e[4]) }; }) };
}
function buildProgram(style, days, equip, split){
  style = ERAS[style] ? style : 'modern';
  split = SPLITS[split] ? split : 'full';
  days = SPLIT_DAYS[split].includes(days) ? days : SPLIT_DAYS[split][SPLIT_DAYS[split].length > 1 ? 1 : 0];
  const tpl = TEMPLATES[style][split][days];
  return {
    style, split, days, equip, schedule: SCHEDULE[days], createdAt: Date.now(),
    workouts: tpl.map(d => ({
      key: d.key, name: d.name,
      exercises: d.ex.map(e => {
        const id = resolveEquip(e[0], equip);
        return { exId:id, sets:e[1], repMin:e[2], repMax:e[3], block:e[4], rest: restFor(style, EX[id], e[4]) };
      })
    }))
  };
}
function estimateMinutes(workout){
  // ~ set başına 40 sn çalışma + dinlenme; + 12 dk ısınma
  const s = workout.exercises.reduce((a, e) => a + e.sets * (40 + e.rest), 0);
  return Math.round(s / 60) + 12;
}
function alternativesFor(exId, equip){
  const ex = EX[exId]; if (!ex) return [];
  return EXERCISES.filter(o => o.id !== exId && o.primary.some(m => ex.primary.includes(m)) && (equip !== 'home' || o.alsoDumbbell || ['dumbbell','bodyweight'].includes(o.equip)))
    .sort((a, b) => (equip === 'machine' ? (b.equip === 'machine') - (a.equip === 'machine') : 0));
}

/* --- Ağırlık önerisi (eski kayıtlara göre) --- */
function suggestWeight(ex, plan, style, history){
  // history: en yeni önce [{date, sets}]
  if (!history.length) return { kg:null, text: ex.inverse ? 'İlk kez: vücut ağırlığının yaklaşık %40-50\'si kadar destek ağırlığı seç.' : ex.bw ? 'İlk kez: vücut ağırlığıyla başla, sonra ek ağırlık ekle.' : 'İlk kez: formu bozmadan rahat tamamladığın bir ağırlıkla başla.' };
  const last = history[0];
  const topKg = Math.max(...last.sets.map(s => +s.kg || 0));
  const workSets = last.sets.filter(s => (+s.kg || 0) >= topKg - 0.01);
  const hit = workSets.length >= plan.sets && workSets.every(s => (+s.reps || 0) >= plan.repMax);
  const inc = increment(ex);
  if (ex.inverse){
    if (hit) return { kg: Math.max(0, topKg - inc), text: `Tüm setler tamam (${topKg} kg destek) → desteği ${inc} kg azalt` };
    return { kg: topKg, text: `Aynı destek (${topKg} kg), tekrarları yakala` };
  }
  if (hit) return { kg: topKg + inc, text: `Geçen sefer tüm setler tamam (${topKg} kg) → +${inc} kg` };
  if (style === 'modern'){
    const minHit = workSets.every(s => (+s.reps || 0) >= plan.repMin);
    return { kg: topKg, text: minHit ? `Aynı kilo (${topKg} kg): tekrarları ${plan.repMax}'e çıkar, sonra ağırlık artar` : `Aynı kilo (${topKg} kg): önce ${plan.repMin}+ tekrarı yakala` };
  }
  // old school: iki kez takıldıysa %10 deload
  const prev = history[1];
  if (prev){
    const prevTop = Math.max(...prev.sets.map(s => +s.kg || 0));
    const prevWork = prev.sets.filter(s => (+s.kg || 0) >= prevTop - 0.01);
    const prevHit = prevWork.length >= plan.sets && prevWork.every(s => (+s.reps || 0) >= plan.repMax);
    if (!prevHit && Math.abs(prevTop - topKg) < 0.01) return { kg: roundPlate(topKg * 0.9), text: `İki kez takıldın → %10 düş (${roundPlate(topKg * 0.9)} kg) ve yeniden tırman` };
  }
  return { kg: topKg, text: `Hedef tutmadı → aynı kilo (${topKg} kg), tekrar dene` };
}

/* --- Grafikler --- */
function barChart(vals, labels, opts){
  opts = opts || {};
  const W = 320, H = 150, padL = 32, padR = 8, padT = 12, padB = 22;
  const n = Math.max(1, vals.length);
  const max = Math.max(opts.target || 0, ...vals, 1);
  const iw = (W - padL - padR) / n, bw = Math.min(26, iw * 0.68);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || '')}">`;
  for (let g = 0; g <= 3; g++){
    const y = padT + (H - padT - padB) * g / 3, v = max * (1 - g / 3);
    s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${padL - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end">${fmtShort(v)}</text>`;
  }
  vals.forEach((v, i) => {
    const x = padL + iw * i + (iw - bw) / 2, h = (H - padT - padB) * v / max, y = H - padB - h;
    s += `<rect class="bar${v > 0 ? '' : ' dim'}" x="${x.toFixed(1)}" y="${(v > 0 ? y : H - padB - 2).toFixed(1)}" width="${bw.toFixed(1)}" height="${(v > 0 ? Math.max(h, 2) : 2).toFixed(1)}" rx="3"/>`;
    if (labels[i] != null) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(labels[i])}</text>`;
    if (opts.showVals && v > 0 && n <= 8) s += `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle">${fmtShort(v)}</text>`;
  });
  if (opts.target){ const y = H - padB - (H - padT - padB) * opts.target / max; s += `<line class="target" x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }
  return s + '</svg>';
}
function lineChart(vals, labels, opts){
  opts = opts || {};
  const W = 320, H = 150, padL = 36, padR = 10, padT = 12, padB = 22;
  if (vals.length < 2) return '';
  let min = Math.min(...vals), max = Math.max(...vals);
  const span = Math.max(1, max - min); min = min - span * 0.25; max = max + span * 0.25;
  const n = vals.length, sx = i => padL + (W - padL - padR) * i / (n - 1), sy = v => padT + (H - padT - padB) * (1 - (v - min) / (max - min));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || '')}">`;
  for (let g = 0; g <= 3; g++){ const y = padT + (H - padT - padB) * g / 3, v = max - (max - min) * g / 3; s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${padL - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end">${r1(v)}</text>`; }
  const pts = vals.map((v, i) => sx(i).toFixed(1) + ' ' + sy(v).toFixed(1));
  s += `<path class="area" d="M${pts[0]} L${pts.join(' L')} L${sx(n - 1).toFixed(1)} ${H - padB} L${padL} ${H - padB} Z"/>`;
  s += `<path class="line" d="M${pts.join(' L')}"/>`;
  s += `<circle class="pt" cx="${sx(n - 1).toFixed(1)}" cy="${sy(vals[n - 1]).toFixed(1)}" r="4"/>`;
  const step = Math.ceil(n / 6);
  labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) s += `<text x="${sx(i).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(l)}</text>`; });
  return s + '</svg>';
}
function ring(pct, over){
  const r = 54, c = 2 * Math.PI * r, p = Math.min(1, Math.max(0, pct));
  return `<svg viewBox="0 0 132 132" aria-hidden="true"><circle class="track" cx="66" cy="66" r="${r}"/><circle class="bar${over ? ' over' : ''}" cx="66" cy="66" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - p)).toFixed(1)}"/></svg>`;
}

function planForDate(d){ const wd = parseYmd(d).getDay(); const i = S.program.schedule.indexOf(wd); if (i < 0) return null; const idx = i % S.program.workouts.length; return { index: idx, workout: S.program.workouts[idx] }; }
function nextTrainingDay(from){ for (let i = 1; i <= 7; i++){ const d = addDays(from, i); const p = planForDate(d); if (p) return { date:d, plan:p }; } return null; }
function exHistory(exId){ const out = []; for (let i = S.workouts.length - 1; i >= 0 && out.length < 6; i--){ const w = S.workouts[i]; const e = w.exercises.find(x => x.exId === exId && x.sets.length); if (e) out.push({ date:w.date, sets:e.sets }); } return out; }
function bestPR(exId){ let best = null; S.workouts.forEach(w => w.exercises.forEach(e => { if (e.exId !== exId) return; e.sets.forEach(s => { const v = e1rm(s.kg, s.reps); if (v > 0 && (!best || v > best.e1rm)) best = { e1rm:v, kg:s.kg, reps:s.reps, date:w.date }; }); })); return best; }
function repLabel(e, ex){ const u = ex.time ? ' sn' : ''; return e.repMin === e.repMax ? e.repMin + u : e.repMin + '-' + e.repMax + u; }
function macroBars(tot, tg){
  const row = (l, v, m, cls) => `<div class="stack-sm"><div class="label"><span>${l}</span><span class="val">${Math.round(v)}/${m} g</span></div><div class="bar"><i class="${cls}" style="width:${Math.min(100, m ? v / m * 100 : 0).toFixed(0)}%"></i></div></div>`;
  return `<div class="macro">${row('Protein', tot.p, tg.prot, 'p')}${row('Karb', tot.c, tg.carb, 'c')}${row('Yağ', tot.f, tg.fat, 'f')}</div>`;
}
function weekStrip(dateStr){
  const mon = mondayOf(dateStr); let h = '<div class="week">';
  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i), wd = parseYmd(d).getDay(), plan = planForDate(d), done = S.workouts.some(w => w.date === d), food = (S.foods[d] || []).length > 0;
    h += `<div class="day${d === today() ? ' today' : ''}" title="${fmtDate(d)}"><span>${DAYS_SHORT[wd]}</span><span class="k${plan ? '' : ' off'}">${plan ? plan.workout.key : '–'}</span><div class="dots">${plan ? '<i class="dot plan"></i>' : ''}${done ? '<i class="dot done"></i>' : ''}${food ? '<i class="dot food"></i>' : ''}</div></div>`;
  }

}

const RADIO_HOSTS = ['https://de1.api.radio-browser.info', 'https://nl1.api.radio-browser.info', 'https://at1.api.radio-browser.info', 'https://fi1.api.radio-browser.info', 'https://de2.api.radio-browser.info'];
const RADIO_PRESETS = [
  { id:'tr', label:'Türkiye popüler', params:{ countrycode:'TR' } },
  { id:'trpop', label:'Türkçe pop', params:{ countrycode:'TR', tag:'pop' } },
  { id:'workout', label:'Antrenman', params:{ tag:'workout' } },
  { id:'dance', label:'EDM / Dance', params:{ tag:'dance' } },
  { id:'hiphop', label:'Hip-Hop', params:{ tag:'hiphop' } },

let radioHost = 0;
function radioStation(s){ return { uuid: s.stationuuid, name: (s.name || '').trim().slice(0, 80), url: s.url_resolved || s.url, favicon: /^https:/.test(s.favicon || '') ? s.favicon : '', country: s.countrycode || '', codec: s.codec || '', bitrate: s.bitrate || 0, tags: (s.tags || '').split(',').filter(Boolean).slice(0, 3).join(', ') }; }

function nextPending(ses){ for (let i = 0; i < ses.exercises.length; i++){ const j = (ses.current + 1 + i) % ses.exercises.length; const e = ses.exercises[j]; if (!e.done && !e.skipped) return j; } return null; }
function completeSet(){

function ensureAudio(){ try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; if (!audioCtx) audioCtx = new C(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
function beep(){
  try { if (!audioCtx) return; const t0 = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach(off => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t0 + off); g.gain.exponentialRampToValueAtTime(0.25, t0 + off + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.18); o.connect(g); g.connect(audioCtx.destination); o.start(t0 + off); o.stop(t0 + off + 0.2); });
  } catch (e) {}
}

function summarize(ses){
  const rows = []; let volume = 0, sets = 0;
  ses.exercises.forEach(e => {
    if (!e.log.length) return;
    const x = EX[e.exId], v = setVolume(e.log), best = bestSet(e.log), bestV = best ? e1rm(best.kg, best.reps) : 0, prev = bestPR(e.exId);
    const hist = exHistory(e.exId);
    const next = suggestWeight(x, { sets: e.targetSets, repMin: e.repMin, repMax: e.repMax }, ses.style, [{ date: today(), sets: e.log }].concat(hist)).text;
    volume += v; sets += e.log.length;
    rows.push({ exId: e.exId, sets: e.log, volume: v, best: bestV, pr: !!(prev && bestV > prev.e1rm + 0.01 && !x.time), first: !prev && !x.time && bestV > 0, next });
  });
  const prev = [].concat(S.workouts).reverse().find(w => w.dayKey === ses.dayKey);

}

  if (!inClaudeApp()) h += `<div class="card"><h3>Claude API anahtarı</h3><p class="hint">Bu sayfa claude.ai dışında çalışıyor. Yapay zeka özellikleri (metin ve fotoğraftan kalori, menü önerisi, koç yorumu) için kendi Anthropic API anahtarını gir. Anahtar yalnızca bu tarayıcının yerel depolamasında kalır, JSON yedeğe yazılmaz; ortak bilgisayarda girme. Kullanım ücreti Anthropic hesabından düşer.</p><div class="field"><span class="label">API anahtarı</span><input id="pApiKey" class="input" type="password" autocomplete="off" value="${esc(p.apiKey || '')}" placeholder="sk-ant-…"></div><div class="grid2"><div class="field"><span class="label">Hızlı model (metin)</span><input id="pApiQuick" class="input" value="${esc(p.apiModelQuick || '')}"></div><div class="field"><span class="label">Model (fotoğraf, menü)</span><input id="pApiModel" class="input" value="${esc(p.apiModel || '')}"></div></div><div class="row"><button class="btn btn-primary" data-action="saveApi">${ICON.check} Kaydet ve bağlan</button>${p.apiKey ? `<button class="btn btn-ghost" data-action="clearApi">Anahtarı sil</button>` : ''}</div></div>`;
  h += `<div class="card"><h3>Claude</h3><p class="hint">${aiState === 'ready' ? 'Bağlı. Beslenme sekmesinde yazdığın öğünleri (ve ' + (aiImages ? 'çektiğin fotoğrafları' : 'metinleri') + ') Claude gramlara, kaloriye ve makrolara böler, günlük menü önerir; antrenman sonunda koç yorumu verir. Her istek senin Claude kullanımından düşer; ilk kullanımda izin sorulur.' : aiState === 'none' ? (inClaudeApp() ? 'Bu görünümde Claude bağlantısı yok. Sayfayı claude.ai içinden açtığında bağlanır.' : 'Bağlı değil: claude.ai dışında yapay zeka için yukarıya API anahtarı gir. Besin listesi, elle giriş, program ve antrenman modu anahtarsız da çalışır.') : 'Bağlantı kontrol ediliyor…'}</p></div>`;
  h += `<div class="card"><h3>Tehlikeli bölge</h3>${confirmKey === 'wipe' ? `<div class="confirm"><span>Tüm profil, beslenme ve antrenman kayıtları silinecek. Önce yedek aldın mı?</span><div class="row nowrap"><button class="btn btn-danger btn-sm" data-action="wipeYes">Evet, hepsini sil</button><button class="btn btn-sm" data-action="cancelConfirm">Vazgeç</button></div></div>` : `<button class="btn btn-danger" data-action="wipe">Tüm verileri sil</button>`}</div>`;

}
function saveProfile(){
  const p = S.profile, old = { style: p.style, days: p.days, equip: p.equip, split: p.split };
  const v = id => ($('#' + id) || {}).value;
  p.name = (v('pName') || '').trim().slice(0, 30); p.sex = v('pSex') === 'k' ? 'k' : 'e';
  p.age = Math.min(100, Math.max(14, parseInt(v('pAge')) || p.age)); p.height = Math.min(230, Math.max(120, parseInt(v('pHeight')) || p.height)); p.weight = Math.min(300, Math.max(30, parseFloat(v('pWeight')) || p.weight));
  p.activity = parseInt(v('pActivity')) || 2; p.goal = GOAL_LABEL[v('pGoal')] ? v('pGoal') : 'maintain';
  p.style = ERAS[v('pStyle')] ? v('pStyle') : 'modern'; p.split = SPLITS[v('pSplit')] ? v('pSplit') : 'full'; p.days = [2, 3, 4, 6].includes(parseInt(v('pDays'))) ? parseInt(v('pDays')) : 3; p.equip = EQUIP_MODES[v('pEquip')] ? v('pEquip') : 'gym';
  p.kcalOverride = Math.max(0, parseInt(v('pKcal')) || 0); p.restSound = !!($('#pSound') || {}).checked; p.vibrate = !!($('#pVibe') || {}).checked;
  S.profileSet = true;
  const regen = old.style !== p.style || old.days !== p.days || old.equip !== p.equip || old.split !== p.split;
  if (regen){ S.program = buildProgram(p.style, p.days, p.equip, p.split); p.days = S.program.days; }
  save(); renderSettings(); toast(regen ? 'Profil kaydedildi, program yeniden oluşturuldu' : 'Profil kaydedildi');
}
function exportData(){ const d = JSON.parse(JSON.stringify(S)); delete d.profile.apiKey; return JSON.stringify(d, null, 2); }
async function exportJson(){
  const json = exportData(), name = 'demir-defteri-' + today() + '.json';
  const mark = () => { S.lastExport = Date.now(); save(); };
  if (DL){
    try { await DL.save({ filename: name, data: json }); mark(); toast('Yedek kaydedildi'); renderSettings(); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  } else if (!window.claude){
    try { const url = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); mark(); toast('Yedek indirildi'); renderSettings(); return; } catch (e) {}
  }
  exportText = json; renderSettings(); toast('İndirme yapılamadı; metni kopyalayabilirsin');
}
function copyJson(){
  const json = exportData();
  const fallback = () => { exportText = json; renderSettings(); const ta = $('#expText'); if (ta){ ta.focus(); ta.select(); } toast('Metni seç ve kopyala'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(() => { S.lastExport = Date.now(); save(); toast('JSON panoya kopyalandı'); renderSettings(); }).catch(fallback);
  else fallback();
}
function tryImport(text){
  try { const d = normalize(JSON.parse(text)); if (!d) throw 0; pendingImport = d; renderSettings(); }
  catch (e) { toast('Geçerli bir Demir Defteri yedeği değil.'); }
}

/* ===== OLAYLAR ===== */
document.addEventListener('click', ev => {

    case 'aiEstimate': aiEstimate(); break;
    case 'aiStop': if (aiCtl) aiCtl.abort(); break;
    case 'pendRemove': pendingItems.splice(num('i'), 1); if (!pendingItems.length) pendingItems = null; renderNutrition(); break;
    case 'clearPending': pendingItems = null; aiMsg = ''; renderNutrition(); break;
    case 'addPending': { if (!pendingItems) break; pendingItems.forEach((it, i) => addFood(Object.assign({ name: it.name, grams: it.grams, kcal: it.kcal, p: it.p, c: it.c, f: it.f, src: photoFile ? 'photo' : 'ai' }, (i === 0 && photoThumb) ? { thumb: photoThumb } : {}))); const n = pendingItems.length; pendingItems = null; foodText = ''; aiMsg = ''; photoFile = null; photoThumb = ''; photoName = ''; renderNutrition(); toast(n + ' kalem günlüğe eklendi'); break; }
    case 'photoClear': photoFile = null; photoThumb = ''; photoName = ''; renderNutrition(); break;
    case 'aiMenu': aiMenu(); break;
    case 'menuAdd': { const menu = S.menus[nutDate]; const m = menu && menu.meals.find(x => x.key === d.k); if (!m) break; nutMeal = d.k; m.items.forEach(it => addFood(Object.assign({}, it, { src: 'menu' }))); renderNutrition(); toast(MEALS[d.k] + ' menüsü günlüğe eklendi'); break; }
    case 'menuClear': delete S.menus[nutDate]; save(); renderNutrition(); break;
    case 'savePlan': { const plan = S.mealPlan.map((m, i) => { const t = ($('[data-plan="' + i + '"][data-k="time"]') || {}).value, pc = parseFloat(($('[data-plan="' + i + '"][data-k="pct"]') || {}).value); return { key: m.key, time: /^\d{1,2}:\d{2}$/.test(t || '') ? t : m.time, pct: Math.max(0, isNaN(pc) ? m.pct : pc) }; }); const tot = plan.reduce((a, m) => a + m.pct, 0); if (tot <= 0) return toast('Yüzdeler toplamı 0 olamaz.'); plan.forEach(m => { m.pct = Math.round(m.pct / tot * 100); }); plan.sort((a, b) => toMin(a.time) - toMin(b.time)); S.mealPlan = plan; S.profile.mealAlert = !!($('#pMealAlert') || {}).checked; save(); renderSettings(); toast('Öğün planı kaydedildi'); break; }
    case 'resetPlan': S.mealPlan = DEFAULT_PLAN.map(m => Object.assign({}, m)); save(); renderSettings(); toast('Varsayılan plan yüklendi'); break;
    case 'pickSel': pickSel = num('i'); pickG = FOODS[pickSel].unitG; renderNutrition(); break;
    case 'pickCancel': pickSel = null; renderNutrition(); break;
    case 'pickUnit': pickG = num('g'); renderNutrition(); break;
    case 'pickG': { const cur = parseFloat(($('#pickGIn') || {}).value) || pickG; pickG = Math.max(0, cur + num('d')); renderNutrition(); break; }
    case 'pickAdd': { const f = FOODS[pickSel]; const g = parseFloat(($('#pickGIn') || {}).value) || pickG || f.unitG; if (!g) return toast('Gram gir.'); const sc = scaleFood(f, g); addFood(Object.assign(sc, { src: 'db' })); pickSel = null; pickQ = ''; renderNutrition(); toast(sc.name + ' eklendi'); break; }
    case 'manualAdd': { const name = (($('#mName') || {}).value || '').trim(); const kcal = Math.round(parseFloat(($('#mKcal') || {}).value) || 0); if (!name) return toast('Bir ad gir.'); if (!kcal) return toast('kcal gir.'); addFood({ name: name.slice(0, 80), grams: Math.round(parseFloat(($('#mG') || {}).value) || 0) || 0, kcal, p: r1(parseFloat(($('#mP') || {}).value) || 0), c: r1(parseFloat(($('#mC') || {}).value) || 0), f: r1(parseFloat(($('#mF') || {}).value) || 0), src: 'manual' }); renderNutrition(); toast(name + ' eklendi'); break; }
    case 'foodDel': { const l = S.foods[nutDate] || []; S.foods[nutDate] = l.filter(f => f.id !== d.id); if (!S.foods[nutDate].length) delete S.foods[nutDate]; save(); renderNutrition(); break; }
    /* program */
    case 'style': case 'days': case 'equip': case 'split': { const p = S.profile; if (a === 'style') p.style = d.k; if (a === 'days') p.days = num('k'); if (a === 'equip' && EQUIP_MODES[d.k]) p.equip = d.k; if (a === 'split' && SPLITS[d.k]){ p.split = d.k; if (!SPLIT_DAYS[d.k].includes(p.days)) p.days = SPLIT_DAYS[d.k][SPLIT_DAYS[d.k].length > 1 ? 1 : 0]; } S.program = buildProgram(p.style, p.days, p.equip, p.split); p.days = S.program.days; save(); renderProgram(); toast('Program yeniden oluşturuldu'); break; }
    case 'exDetail': exSheet(d.ex, d.w != null ? num('w') : null, d.e != null ? num('e') : null); break;
    case 'swap': { const w = S.program.workouts[num('w')]; if (w && w.exercises[num('e')] && EX[d.new]){ const e = w.exercises[num('e')]; e.exId = d.new; e.rest = restFor(S.program.style, EX[d.new], e.block); save(); } closeSheet(); renderProgram(); toast('Hareket değiştirildi'); break; }
    /* antrenman */
    case 'startDay': startSession(num('i')); break;
    case 'quick': startQuick(num('i')); break;
    case 'musicPlay': { if (!mq.queue.length || mq.queue.indexOf(d.id) < 0) buildQueue(d.id); mq.index = mq.queue.indexOf(d.id); playTrack(d.id); break; }

    case 'ytDel': { S.music.ytLists = S.music.ytLists.filter(m => m.list !== d.list); if (ytOpen === d.list) ytOpen = ''; save(); render(); break; }
    case 'dlHtml': { if (!DL) return; el.disabled = true; fetch('demir-defteri.html').then(r => { if (!r.ok) throw 0; return r.text(); }).then(t => DL.save({ filename: 'demir-defteri.html', data: t })).then(() => toast('Kaydedildi: demir-defteri.html')).catch(e => { if (!(e && e.code === 'declined')) toast('İndirme yapılamadı; sohbetteki HTML dosyasını kullan.'); }).finally(() => { el.disabled = false; }); break; }
    case 'musicNext': playNext(false); break;
    case 'musicPrev': playPrev(); break;
    case 'musicShuffle': S.music.shuffle = !S.music.shuffle; save(); buildQueue(mq.trackId); render(); break;
    case 'musicDel': { S.music.tracks = S.music.tracks.filter(t => t.id !== d.id); mdbDel(d.id).catch(() => {}); if (mq.trackId === d.id && audioEl){ audioEl.pause(); mq.trackId = null; mq.name = ''; updateMini(); } mq.queue = mq.queue.filter(x => x !== d.id); save(); render(); break; }
    case 'streamPlay': { const u = (($('#streamIn') || {}).value || '').trim(); if (!/^https?:\/\//i.test(u)) return toast('Tam yayın adresi gir (https://…).'); S.music.stream = u.slice(0, 300); save(); playStream(u); break; }
